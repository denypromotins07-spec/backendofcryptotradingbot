[package]
name = "hft_crypto_bot"
version = "0.8.0"
edition = "2021"
authors = ["HFT Quantitative Developer"]
description = "Ultra-low-latency crypto trading bot with SMC, DeFi analytics, and portfolio optimization"
license = "MIT"

[lib]
name = "hft_crypto_bot"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = false
target-cpu = "native"

[profile.dev]
opt-level = 0
debug = false

[package]
name = "ultra_low_latency_crypto_bot"
version = "0.1.0"
edition = "2021"
authors = ["Quantitative Developer"]
description = "Ultra-low-latency crypto trading bot with custom allocator and lock-free structures"

[dependencies]
# No external dependencies for core path - pure std only
libc = "0.2"
crossbeam-utils = { version = "0.8", default-features = false }

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
# SBE schema parser will be generated by build.rs

[[bench]]
name = "ring_buffer_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
